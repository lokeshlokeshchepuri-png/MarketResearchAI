name: MarketResearchAI Daily Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1-5'

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install yfinance pandas numpy openpyxl requests

      - name: Run scanner
        run: python multi_stock_scanner.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: MarketResearchAI-Reports
          path: |
            *.xlsx
            *.csv
          if-no-files-found: warn
